# ==============================================================================
# Production Docker Compose for E-Polbangtan HealtCare (E-Klinik)
# Target: Linux Debian VPS (RAM: 6GB)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Application Core (PHP 8.3-FPM)
  # ----------------------------------------------------------------------------
  klinik-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_klinik_app
    restart: always
    volumes:
      # Mount .env read-write untuk mengizinkan artisan key:generate
      - ./.env:/var/www/html/.env
      - klinik_storage:/var/www/html/storage
      - klinik_bootstrap_cache:/var/www/html/bootstrap/cache
      - klinik_public_build:/var/www/html/public/build
    depends_on:
      klinik-db:
        condition: service_healthy
      klinik-redis:
        condition: service_healthy
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

  # ----------------------------------------------------------------------------
  # Web Server & Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  klinik-web:
    image: nginx:alpine
    container_name: polbangtan_klinik_web
    restart: always
    ports:
      # Terbuka pada port 8001 (0.0.0.0:8001) untuk akses browser langsung / reverse proxy
      - "${DOCKER_APP_PORT:-8001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      # Non-nested mount: volume build dipasang ke direktori mandiri /var/www/build:ro
      # Mencegah runc mkdirat crash & error 404 aset Vite
      - klinik_public_build:/var/www/build:ro
      - klinik_storage:/var/www/html/storage:ro
    depends_on:
      - klinik-app
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

  # ----------------------------------------------------------------------------
  # Asynchronous Background Worker (Laravel Queue Worker)
  # ----------------------------------------------------------------------------
  klinik-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_klinik_worker
    restart: always
    command: php artisan queue:work redis --verbose --tries=3 --timeout=120 --memory=256 --max-jobs=1000 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - klinik_storage:/var/www/html/storage
      - klinik_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      klinik-db:
        condition: service_healthy
      klinik-redis:
        condition: service_healthy
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  # ----------------------------------------------------------------------------
  # Scheduled Cron Runner (Laravel Scheduler)
  # Menjalankan pembersihan harian sso:prune-tickets & maintenance
  # ----------------------------------------------------------------------------
  klinik-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_klinik_scheduler
    restart: always
    command: php artisan schedule:work
    volumes:
      - ./.env:/var/www/html/.env:ro
      - klinik_storage:/var/www/html/storage
      - klinik_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      klinik-db:
        condition: service_healthy
      klinik-redis:
        condition: service_healthy
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # ----------------------------------------------------------------------------
  # In-Memory Cache, Session & Queue Engine (Redis 7)
  # ----------------------------------------------------------------------------
  klinik-redis:
    image: redis:7-alpine
    container_name: polbangtan_klinik_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-secretredis}" --appendonly yes
    volumes:
      - klinik_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secretredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Relational Database (MySQL 8.0)
  # ----------------------------------------------------------------------------
  klinik-db:
    image: mysql:8.0
    container_name: polbangtan_klinik_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-polbangtan_healtcare}
      MYSQL_USER: ${DB_USERNAME:-klinik_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secretroot}
    volumes:
      - klinik_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - klinik_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

# ------------------------------------------------------------------------------
# Storage Volumes & Private Network
# ------------------------------------------------------------------------------
volumes:
  klinik_db_data:
    name: polbangtan_klinik_db_data
  klinik_redis_data:
    name: polbangtan_klinik_redis_data
  klinik_storage:
    name: polbangtan_klinik_storage
  klinik_bootstrap_cache:
    name: polbangtan_klinik_bootstrap_cache
  klinik_public_build:
    name: polbangtan_klinik_public_build

networks:
  klinik_net:
    name: polbangtan_klinik_network
    driver: bridge
