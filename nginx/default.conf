# ==============================================================================
# Nginx Production Configuration for E-Polbangtan HealtCare (E-Klinik)
# ==============================================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Izinkan kamera untuk pemindaian presensi QR Code Konseling/Kesehatan
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Application Routing & Healthcheck
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static Assets Caching (Vite build assets via dedicated non-nested volume)
    # Menghindari runc mkdirat conflict & error 404 hash Vite
    location ^~ /build/ {
        alias /var/www/build/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Public Storage Assets (foto profil, foto obat, dokumen publik)
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM FastCGI Handler
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass klinik-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Tuning Timeout & Buffers untuk DomPDF (Surat Sehat/Sakit) dan Excel Export
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # --------------------------------------------------------------------------
    # Security Hardening (File & Storage Restrictions)
    # --------------------------------------------------------------------------
    # Blokir akses ke file dot/tersembunyi (.env, .git, dsb)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir file sensitif
    location ~* \.(sql|log|sh|bak|yml|yaml|lock|env|git|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses langsung ke storage privat RPD / rekam medis mahasiswa
    location ^~ /storage/app/rpd_private/ {
        deny all;
        return 404;
    }

    location ^~ /storage/app/private/ {
        deny all;
        return 404;
    }
}
